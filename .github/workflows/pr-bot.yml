name: PR Approval Bot

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  classify:
    runs-on: ubuntu-latest

    steps:
      - name: Classify PR
        run: |
          TITLE="${{ github.event.pull_request.title }}"

          echo "PR title: $TITLE"

          if [[ "$TITLE" == low-risk:* ]]; then
            echo "LOW_RISK=true" >> "$GITHUB_ENV"
          else
            echo "LOW_RISK=false" >> "$GITHUB_ENV"
          fi

      - name: Comment low-risk decision
        if: env.LOW_RISK == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Bot decision: low-risk change can continue.'
            })

      - name: Comment high-risk decision
        if: env.LOW_RISK != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Bot decision: high-risk change requires human review.'
            })

      - name: Block high-risk change
        if: env.LOW_RISK != 'true'
        run: |
          echo "High-risk change requires human review."
          exit 1
